domains:
    # Domaine digit = one-hot du chiffre + (cos, sin) de l'angle de l'image.
    # Poids de la MSE sur l'angle par rapport à la cross entropy sur le chiffre
    # (les deux sont normalisées : 0 = parfait, ~1 = hasard).
    digit:
        angle_loss_weight: 1.0

global_workspace:
    latent_dim: 10

    representation_loss_coefficients:
        # Cycles par direction plutôt que `cycles` (moyenne des deux) : le cycle
        # image -> GW -> digit -> GW -> image est désactivé, car il demande de
        # retrouver le style de l'image à partir d'un chiffre et d'un angle, ce
        # que le modèle ne peut faire qu'en cachant le style dans les petits
        # écarts du vecteur digit (cf test_digit_space.ipynb).
        cycles: 1.0
        contrastives: 0.01
        demi_cycles: 1.0
        translations: 1.0
    loss_coefficients:
        representation_loss: 1.0
        representation_loss_rotated: 1.0
        rotate_pixel_loss: 1.0
        rotate_pixel_loss_rotated: 1.0
        rotate_vae_loss: 1.0
        rotate_vae_loss_rotated: 1.0
        rotate_gw_loss: 0.0
        rotate_gw_loss_rotated: 0.0
        rotate_gw_digit_loss: 0.0
        rotate_gw_digit_loss_rotated: 0.0
        rotate_gw_fused_loss: 0.0
        rotate_gw_fused_loss_rotated: 0.0
        rotate_digit_loss: 1.0
        rotate_digit_loss_rotated: 1.0
        rotate_vae_digit_loss: 1.0
        rotate_vae_digit_loss_rotated: 1.0
    encoders:
        hidden_dim:
            image: 256
            digit: 256
            operation: 256
        n_layers: 2

    # Rotation apprise pour un angle fixe (cf operation_rotation_module.py),
    # une variante par espace, pour comparer laquelle apprend le mieux :
    #  - pixel : directement sur l'image (CNN), latent_dim = largeur du goulot
    #    d'étranglement entre l'encodeur et le décodeur convolutifs.
    #  - vae   : dans le latent du VAE (mu, 20D), MLP ;
    #  - gw    : dans l'espace du global workspace (10D), même MLP ;
    #  - gw_digit : dans le GW, encodage du vrai digit (10D) : ne contient que
    #    chiffre et angle, sans le style ;
    #  - gw_fused : fusion des deux états GW précédents, 0.5 (gw + gw_digit), 10D ;
    #  - digit : dans le domaine digit (vrai digit, 12D) ;
    #  - vae_digit : rotations vae et digit fusionnées dans le GW, décodées
    #    dans les deux domaines ; réutilise les modules vae et digit (à activer
    #    aussi), gelés pour cette loss : elle n'entraîne que le GW. image_weight = poids de la branche vae dans la
    #    fusion (celle de digit vaut 1 - image_weight), dans ]0, 1[ ;
    #    learn_image_weight : true = poids appris par la loss vae_digit, à
    #    partir de image_weight ; false = poids fixe.
    #    Pour les espaces latents : hidden_size = largeur des couches denses et
    #    latent_dim = taille de la couche intermédiaire ; garder les mêmes
    #    valeurs pour que seul l'espace diffère.
    # degrees : angle de la rotation apprise, commun à toutes les variantes.
    # n_steps : nombre de rotations enchaînées dans la loss (1 = une seule
    #    rotation) ; la loss est la moyenne sur les étapes 1..n_steps.
    # enabled : variantes construites et entraînées ; les autres sont ignorées
    #    (pas de module, pas de loss), leurs sections peuvent rester.  [pixel, vae, gw, gw_digit, gw_fused, digit]
    rotation_operations:
        enabled: [pixel, vae, digit, vae_digit]
        degrees: 20.0
        n_steps: 4
        pixel:
            latent_dim: 64
        vae:
            hidden_size: 64
            latent_dim: 32
        gw:
            hidden_size: 64
            latent_dim: 32
        gw_digit:
            hidden_size: 64
            latent_dim: 32
        gw_fused:
            hidden_size: 64
            latent_dim: 32
        digit:
            hidden_size: 64
            latent_dim: 32
        vae_digit:
            image_weight: 0.5
            learn_image_weight: true

    decoders:
        hidden_dim:
            image: 256
            digit: 256
        n_layers: 2

training:
    optim:
        lr: 0.001

    max_steps: 10000
    devices: 1
    batch_size: 512
