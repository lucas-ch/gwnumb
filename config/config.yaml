domains:
    # Domaine digit = one-hot du chiffre + (cos, sin) de l'angle de l'image.
    # Poids de la MSE sur l'angle par rapport à la MSE sur le chiffre.
    digit:
        angle_loss_weight: 1.0

global_workspace:
    latent_dim: 10

    representation_loss_coefficients:
        cycles: 1.0
        contrastives: 0.01
        demi_cycles: 1.0
        translations: 1.0
    loss_coefficients:
        representation_loss: 1.0
        representation_loss_rotated: 1.0
        rotate_pixel_loss: 1.0
        rotate_pixel_loss_rotated: 1.0
        rotate_gw_loss: 1.0
        rotate_gw_loss_rotated: 1.0
    encoders:
        hidden_dim:
            image: 256
            digit: 256
            operation: 256
        n_layers: 2

    # Rotation apprise pour un angle fixe (cf operation_rotation_module.py),
    # une variante par espace, pour comparer laquelle apprend le mieux :
    #  - pixel : directement sur l'image (CNN), latent_dim = largeur du goulot
    #    d'étranglement entre l'encodeur et le décodeur convolutifs.
    #  - gw    : directement dans l'espace du global workspace (MLP), avec
    #    hidden_size = largeur des couches denses et latent_dim = taille de la
    #    couche intermédiaire (goulot seulement si < latent_dim du GW).
    # degrees : angle de la rotation apprise, commun aux deux variantes.
    # n_steps : nombre de rotations enchaînées dans la loss (1 = une seule
    #    rotation) ; la loss est la moyenne sur les étapes 1..n_steps.
    rotation_operations:
        degrees: 20.0
        n_steps: 4
        pixel:
            latent_dim: 64
        gw:
            hidden_size: 64
            latent_dim: 32

    decoders:
        hidden_dim:
            image: 256
            digit: 256
        n_layers: 2

training:
    optim:
        lr: 0.001

    max_steps: 10000
    devices: 1
    batch_size: 512
